services:
  mongodb:
    image: mongo:7.0
    container_name: packlite-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: packlite
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - packlite-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/packlite --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Optional: MongoDB Express for database management UI
  mongo-express:
    image: mongo-express:latest
    container_name: packlite-mongo-express
    restart: unless-stopped
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password123
      ME_CONFIG_MONGODB_URL: mongodb://admin:password123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - packlite-network

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  packlite-network:
    driver: bridge
